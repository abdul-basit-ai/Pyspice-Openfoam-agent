category: mosfets
# ALL Texas Instruments NexFET power MOSFETs (user directive: single trusted
# manufacturer, datasheet-verified values — 2026-09-20 rework replacing the
# mixed Infineon/Vishay/Nexperia/onsemi catalog, one entry of which
# (SISS44DN10) could not be verified as a real part).
#
# EVERY value below was extracted programmatically (pypdf) from the TI
# datasheet PDF at the linked URL — not transcribed from aggregators.
# Units: V, A, Ohm, C (charge), F, mm, degC/W.
# Capacitances are MAX at VGS=0 V, f=1 MHz at the datasheet's stated VDS;
# gate charges are MAX at the stated VGS drive; Qrr from the diode table.
# NOTE V_plateau: TI does not TABULATE a plateau voltage for these parts
# (it appears only in the Qg-vs-VGS figure). The values below are
# documented conservative estimates = VGS(th) MAX + plateau headroom
# (conservative: a higher plateau lengthens the modeled crossover time and
# hence over- rather than under-predicts switching loss).
parts:
  # --- 25V class (12V bus / 5V and below outputs) ---
  - part_number: CSD16321Q5
    manufacturer: Texas Instruments
    Vds_max: 25.0
    Rds_on: 0.0024      # max @ VGS=8V, ID=25A (SLPS220E p.3)
    Qg: 19e-9           # max, total @ 4.5 V
    Qgd: 2.5e-9
    V_plateau: 2.6      # estimate: VGS(th) max 1.4 V + headroom (see header)
    Ciss: 3100e-12
    Coss: 2200e-12
    Crss: 150e-12
    Qrr: 33e-9
    V_F: 1.0            # VSD max, ISD=25A
    Id_max: 100.0       # package-limited continuous
    package: SON5x6
    die_x_mm: 5.0       # package footprint (die dims not published by TI)
    die_y_mm: 6.0
    die_z_mm: 1.0
    R_theta_jc: 1.1
    R_theta_ja: 50.0
    Tj_max: 150.0
    datasheet:
      url: "https://www.ti.com/lit/gpn/csd16321q5"
      page: 3
      note: "SLPS220E: 25V 2.4mOhm NexFET SON5x6; values extracted from PDF"
