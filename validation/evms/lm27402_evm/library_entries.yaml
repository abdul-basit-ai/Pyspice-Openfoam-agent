      Coss: {value: 1050e-12, source: published, note: "@ 15 V, 1 MHz"}
      Crss: {value: 440e-12, source: published, note: "@ 15 V, 1 MHz"}
      Qrr: {value: null, source: published_null, note: "rig omits the Qrr term when null"}
      V_F: {value: 0.7, source: pipeline_estimate, note: "schema default"}
      Id_max: {value: 60.0, source: published, note: "@ Tc"}
      package: PowerPAK-SO-8
      die_x_mm: {value: 6.15, source: published}
      die_y_mm: {value: 5.15, source: published}
