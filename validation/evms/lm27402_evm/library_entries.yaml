# Phase 1 schema entries for the EVM power path, filled from each part's own
# datasheet. STATUS flags per validation plan step 2:
#   published        - value read from the part datasheet / EVM BOM
#   derived          - computed from a published figure (derivation in note)
#   pipeline_estimate- the field gates the rig's physics but is not published;
#                      value is a documented estimate, listed in
#                      test_conditions.unmatched_factors and given a
#                      sensitivity note in error_report.md
#   sentinel         - schema-required but UNUSED by the simulated physics
#                      (screening is bypassed in this plan); not a real rating
mosfets:
  - role: hs
    part_number: SiR436DP
    manufacturer: Vishay Siliconix
    status_fields:
      Vds_max: {value: 25.0, source: published}
      Rds_on: {value: 0.0046, source: published, note: "max @ 10 V (BOM: 6.2 mOhm typ @ 4.5 V)"}
      Qg: {value: 47e-9, source: published, note: "max @ 10 V; 20 nC max @ 4.5 V"}
      Qgd: {value: 3.9e-9, source: published}
      V_plateau: {value: 2.6, source: pipeline_estimate, note: "not tabulated by Vishay (figure only); low-Vth logic-level TrenchFET; SENSITIVITY: +/-0.5 V shifts modeled crossover ~20 %"}
      Ciss: {value: 1715e-12, source: published, note: "max @ 15 V"}
      Coss: {value: null, source: published_null, note: "not surfaced; rig omits the Coss switching term (documented behavior)"}
      Crss: {value: null, source: published_null}
      Qrr: {value: null, source: published_null, note: "rig omits the Qrr term when null"}
      V_F: {value: 0.7, source: pipeline_estimate, note: "schema default; Vishay VSD not surfaced"}
      Id_max: {value: 40.0, source: published}
      package: PowerPAK-SO-8
      die_x_mm: {value: 6.15, source: published}
      die_y_mm: {value: 5.15, source: published}
      die_z_mm: {value: 1.0, source: pipeline_estimate}
      R_theta_jc: {value: 1.4, source: sentinel, note: "not used - thermal out of scope (airflow unstated)"}
      R_theta_ja: {value: 50.0, source: sentinel, note: "not used"}
