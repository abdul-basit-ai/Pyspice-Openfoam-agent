evm_id: lm5175evm_hd
controller: LM5175
topology: buck_boost   # 4-switch non-inverting (exact pipeline match)
vin_v: 12.0
vout_v: 12.0
iout_max_a: 6.0
fsw_hz: 400000
ambient_c: null
airflow: unknown
notes: >
  SNVU439 (LM5175EVM-HD). Efficiency vs Output Current (Figure 5) shows
  VIN = 6/12/18/24/42 V curves, VOUT = 12 V, 0-6 A. Validation target: the
  VIN = 12 V curve (the transition point where all four switches conduct
  equally, minimizing the single-MOSFET injection caveat below).
unmatched_factors:
  - gate_drive_behavioral_5v
  - qgd_estimated                # BSZ042N06NS Qgd unpublished; 7 nC class estimate, sensitivity noted in error_report
  - no_input_rail_loss
injection_caveat: >
  Per-switch injection (post engine upgrade): leg 1 (QH1/QL1) carries
  BSZ042N06NS and leg 2 (QH2/QL2) carries BSZ0902NS, exactly as the EVM BOM.
  BSZ0902NS Qgd and Vplateau are schema-required estimates (unused by the
  loss model for the sync role); its Coss/Qrr are unpublished and omitted.
  This supersedes the earlier single-part-injection result (MAE 2.66 pp),
  which modeled 4.2 mOhm on all four switches and under-predicted efficiency
  by construction on the 2.6 mOhm leg.
open_questions:
  - >
    UNEXPLAINED RESIDUAL: the per-switch-part fix (BSZ042N06NS on leg 1,
    BSZ0902NS on leg 2) reduced MAE only marginally (2.66 -> 2.47 pp), not
    to the ~1 pp predicted from the leg-2 conduction analysis. The real
    board's 12 V transition point is unusually efficient (~98.3 pct) and
    the modeled gate/crossover terms plus conservative mask assumptions
    still overshoot loss there for reasons not yet isolated. Unconfirmed
    candidate explanations, NOT verified: the behavioral 5 V gate-drive
    model (no driver IC behavior), omitted Qrr on the LS parts, and
    crossover-loss model assumptions (TI-Lakkas first-order with clamps)
    not suited to this switching regime. Treated as a known limitation and
    open question for future work - the 2.47 pp number is NOT understood
    or bounded.
superseded_result: >
  The first published buck-boost number (MAE 2.66 pp, worst -3.22 pp @ 6 A)
  used a SINGLE MOSFET part (BSZ042N06NS, 4.2 mOhm) on all four switches,
  which over-modeled conduction on the QH2/QL2 leg the EVM implements with
  BSZ0902NS (2.6 mOhm) - a uniformly conservative bias. That result is
  superseded by the per-switch injection above; both numbers are kept for
  transparency.
thermal_in_scope: false
