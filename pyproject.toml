[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspice-openfoam-agent"
version = "0.1.0"
description = "Autonomous DC-DC power converter synthesizer coupled with OpenFOAM conjugate heat transfer."
authors = [{ name = "Developer" }]
requires-python = ">=3.10"
dependencies = [
    "PySpice==1.5",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "pyvista>=0.44.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "streamlit>=1.36.0",
    "schemdraw>=0.18",
    "matplotlib>=3.8.0",
    "pymoo>=0.6.0",
    "control>=0.9.4",  # python-control: deterministic Bode/margin analysis
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]